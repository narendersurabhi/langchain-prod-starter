[project]
name = "langchain-prod-starter"
version = "0.1.0"
description = "Production-grade LangChain starter with FastAPI."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "LangChain Prod Starter" }]

dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.2.1",
  "structlog>=24.1.0",
  "prometheus-client>=0.20.0",
  "opentelemetry-api>=1.25.0",
  "opentelemetry-sdk>=1.25.0",
  "opentelemetry-instrumentation-fastapi>=0.46b0",
  "opentelemetry-exporter-otlp>=1.25.0",
  "langchain-core>=0.2.20",
  "langchain-community>=0.2.20",
  "faiss-cpu>=1.8.0",
  "numpy>=1.26.4",
]

[project.optional-dependencies]
openai = ["langchain-openai>=0.1.7"]
anthropic = ["langchain-anthropic>=0.1.15"]
ollama = ["langchain-ollama>=0.1.4"]

dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.7",
  "pytest-cov>=5.0.0",
  "httpx>=0.27.0",
  "ruff>=0.4.8",
  "mypy>=1.10.0",
  "types-requests>=2.32.0.20240602",
  "pre-commit>=3.7.0",
]

[build-system]
requires = ["hatchling>=1.24.2"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
indent-width = 4
select = ["E", "F", "I", "B", "UP", "N", "S", "A"]
ignore = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-q --cov=src/lc_app --cov-report=term-missing"

[tool.hatch.build.targets.wheel]
packages = ["src/lc_app"]
